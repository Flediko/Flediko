<svg viewBox="0 0 900 260" width="900" height="260" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', 'Fira Code', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="55%" stop-color="#0b1530"/>
      <stop offset="100%" stop-color="#082230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1c2b4a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>
  <rect width="900" height="260" fill="url(#grid)" opacity="0.5"/>
  <rect width="900" height="260" fill="url(#glow)"/>

  <!-- circuit traces -->
  <g stroke="#1e90b8" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M0,40 H150 L170,60 H340">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M900,210 H700 L680,190 H520">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,220 H90 L110,200 H260 L280,220 H400">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="340" cy="60" r="3.5" fill="#22d3ee"/>
  <circle cx="520" cy="190" r="3.5" fill="#818cf8"/>
  <circle cx="400" cy="220" r="3.5" fill="#22d3ee"/>

  <!-- prompt line -->
  <text x="60" y="90" fill="#3fe08a" font-size="16" letter-spacing="1">
    <tspan fill="#5b6b8c">guest@root</tspan><tspan fill="#3fe08a">:~$</tspan> whoami
  </text>

  <!-- typing name -->
  <g>
    <clipPath id="reveal">
      <rect x="0" y="0" height="70" width="0">
        <animate attributeName="width" values="0;560;560" keyTimes="0;0.6;1" dur="3s" fill="freeze"/>
      </rect>
    </clipPath>
    <text x="58" y="150" font-size="52" font-weight="700" fill="url(#accent)" clip-path="url(#reveal)">
      AAKASH SINGH
    </text>
  </g>
  <rect x="58" y="118" width="4" height="42" fill="#22d3ee">
    <animate attributeName="x" values="58;618;618" keyTimes="0;0.6;1" dur="3s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="3s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="60" y="190" font-size="17" fill="#9fb3d1" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;1" dur="3.2s" fill="freeze"/>
    <tspan fill="#3fe08a">[OK]</tspan> Certified Ethical Hacker &#8226; Backend &amp; Security Engineer
  </text>
  <text x="60" y="216" font-size="14" fill="#5b6b8c" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;1" dur="3.6s" fill="freeze"/>
    FastAPI &#8226; React &#8226; PostgreSQL &#8226; Redis &#8226; Flask
  </text>

  <!-- corner badge -->
  <g transform="translate(800,40)" opacity="0.9">
    <circle r="26" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="18" fill="#22d3ee" font-weight="700">CEH</text>
  </g>
</svg>
